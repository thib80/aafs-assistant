<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AAFS-Anne</title>
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            /* Use background image */
            background-image: url("https://seguin-varagnes.eu/wp-content/uploads/2024/02/FS_Logo_Light-e1713901279664.png"); /* Replace with your image filename */
            background-size: contain;
            background-repeat: no-repeat;
            background-attachment: fixed; /* Keep background fixed */
            background-position: center;
            color: ivory; /* Text color for better contrast */
            /* Add transparency to the overall content */
            background-color: rgba(69, 9, 9, 0.5); /* Example: 50% black overlay */
        }

        #chatbox {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            /* Add transparency to the chatbox */
            background-color: rgba(69, 9, 9, 0.5); /* Example: 70% black background */
        }

        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 10px;
            width: 80%;
            word-break: break-word;
            box-sizing: border-box;
            /* Add transparency to the messages */
            opacity: 0.9; /* Example: 90% opacity */
        }

        .user-message {
            background-color: rgba(44, 4, 4, 0.9); /* Add transparency */
            align-self: flex-start;
            float: left;
        }

        .bot-message {
            background-color: rgba(44, 4, 4, 0.9); /* Add transparency */
            align-self: flex-end;
            float: right;
            border-color: white;
            border-style: solid;
            border-width: 1px 1px;
        }
        .expand-button {
            background-color: rgba(44, 4, 4, 0.9); /* Example background color */
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            border-color: white;
            border-width: 1px 1px;
            border-style: solid;
            cursor: pointer;
            margin-top: 5px; /* Add some spacing */
            font-size: 0.9em;
        }

        #input-area {
            padding: 10px;
            display: flex;
            background-color: rgba(69, 9, 9, 0.5); /* Example: 50% black overlay */
        }

        #user-input {
            flex: 1;
            font-size: medium;
            margin-right: 10px;
            border-radius: 5px;
            padding: 8px;
        }

        #send-button {
            padding: 8px 15px;
            border-radius: 5px;
            background-color: #2a2e06;
            color: white;
            border: none;
            cursor: pointer;
        }

        #send-button.loading {
            pointer-events: none; /* Disable button clicks */
            opacity: 0.7; /* Reduce opacity */
             /* Animate button background */
            animation: pulse 1s infinite;
        }

        img { 
            max-width: 300px;
            max-height: 200px;  
        }
        h1 { font-size: 2em; }
        h3 { font-size: 1.5em; margin-top: 1em; }
        h4 { font-size: 1.2em; margin-top: .5em; }
        ul { list-style-type: disc; margin-left: 20px; }
        ol { list-style-type: disc;}
        a { color: #007bff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .problem { margin-bottom: 1em; }
        .section { margin-bottom: 2em; border-bottom: 1px solid #eee; padding-bottom: 1em;}


                @keyframes pulse {
                    0% { background-color: #2a2e06; }
                    50% { background-color: #4d5219; }
                    100% { background-color: #2a2e06; }
                }

            #loading { display: none; } /* Hide the loading text element. Use button animation */

    </style>
</head>

<body>
    <div id="chatbox"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type your message...">
        <button id="send-button">Send</button>
    </div>


    <script>
        const chatbox = document.getElementById('chatbox');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const backendUrl = 'https://anne-backend-303057230676.europe-west6.run.app/process';
        let sessionId = null;

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            const input = userInput.value;
            if (input.trim() === '') return;

            displayMessage(input, 'user-message');
            userInput.value = '';
            userInput.disabled = true; // Disable input
            sendButton.classList.add("loading"); // Add loading class to button


            const response = await fetch(backendUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ message: input, sessionId: sessionId }),
            });


            userInput.disabled = false; // Re-enable input
            userInput.focus();
            sendButton.classList.remove("loading"); // Remove loading class


            const data = await response.json();
            if (data.sessionId) {
                sessionId = data.sessionId;
            }
            if (data.html) {
                displayMessage(data.html, 'bot-message');
            } else {
                console.error('Invalid response from backend:', data);
                displayMessage('Error: Could not get a response from the chatbot.', 'bot-message');
            }
        }

        // function displayMessage(message, messageClass) {
        //     const messageElement = document.createElement('div');
        //     messageElement.classList.add('message', messageClass);
        //     messageElement.innerHTML = message;
        //     chatbox.appendChild(messageElement);
        //     chatbox.scrollTop = chatbox.scrollHeight;
        // }
        function displayMessage(message, messageClass) {
        const messageElement = document.createElement('div');
        messageElement.classList.add('message', messageClass);

        // Check if the message contains details to be expandable
        if (message.includes("||DETAILS START||") && message.includes("||DETAILS END||")) {
            const [beforeDetails, detailsSection, afterDetails] = message.split(/(\|\|DETAILS START\|\|[\s\S]*\|\|DETAILS END\|\|)/);

            messageElement.innerHTML = beforeDetails;

            const detailsContainer = document.createElement('div');
            detailsContainer.style.display = 'none'; // Initially hidden
            detailsContainer.innerHTML = detailsSection.replace("||DETAILS START||", "").replace("||DETAILS END||", "");

            const expandButton = document.createElement('button');
            expandButton.classList.add("expand-button"); // Add the class here
            expandButton.textContent = "Show Details";
            expandButton.addEventListener('click', () => {
                if (detailsContainer.style.display === 'none') {
                    detailsContainer.style.display = 'block';
                    detailsContainer.style.font = 'block'
                    expandButton.textContent = "Hide Details";
                } else {
                    detailsContainer.style.display = 'none';
                    expandButton.textContent = "Show Details";
                }
            });

            messageElement.appendChild(expandButton);
            messageElement.appendChild(detailsContainer);
            if (afterDetails) {  // Append any content after the details
                const afterDetailsElement = document.createElement('div');
                afterDetailsElement.innerHTML = afterDetails;
                messageElement.appendChild(afterDetailsElement);
            }

        } else {
            messageElement.innerHTML = message; // Display the message normally if no details are present
        }


        chatbox.appendChild(messageElement);
        chatbox.scrollTop = chatbox.scrollHeight;
    }
    </script>
</body>

</html>
